site_name: apexe
site_description: Governed execution for CLI tools and HTTP APIs. Run CLI commands locally and expose CLI and OpenAPI operations through MCP and A2A.
site_url: https://aiperceivable.github.io/apexe/

repo_name: aiperceivable/apexe
repo_url: https://github.com/aiperceivable/apexe

validation:
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  logo: assets/apexe-logo.svg
  favicon: assets/apexe-logo.svg
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guide Index: documentation.md
  - Quick Start: quickstart.md
  - Agent Integration: agent-skill.md
  - User Manual: user-manual.md
  - Contract Verification: verification.md
  - OpenAPI Import: openapi.md
  - Threat Model: threat-model.md
  - Authoring Overlays: overlays.md
  - Overlay Consumers: overlay-consumers.md
  - Developer Guide: developer-guide.md
  - Agent Skill Verification: agent-skill-verification.md
  - Changelog: changelog.md
  - Architecture:
      - Feature Manifest: FEATURE_MANIFEST.md
      - Technical Design (historical): apcore-integration/tech-design.md
  - Feature Specs:
      - Overview: features/v2-overview.md
      - F1 - Scanner Adapter: features/v2-f1-scanner-adapter.md
      - F2 - Module Executor: features/v2-f2-module-executor.md
      - F3 - Binding Output: features/v2-f3-binding-output.md
      - F4 - MCP Server: features/v2-f4-mcp-server.md
      - F5 - Governance: features/v2-f5-governance.md
      - F6 - Error Migration: features/v2-f6-error-migration.md
      - F7 - Config Integration: features/v2-f7-config-integration.md
      - F8 - Local Execution: features/v2-f8-local-execution.md
  - Examples:
      - Overview: examples.md
      - Basic: examples/basic/README.md
      - CLI Permissions: examples/cli_permissions/README.md
      - Local Execution: examples/local_execution/README.md
      - Verification: examples/verification/README.md
      - OpenAPI Import: examples/openapi_import/README.md
      - Path Guard: examples/path_guard/README.md
      - Programmatic: examples/programmatic/README.md
      - ACL Library: examples/acl_demo/README.md
