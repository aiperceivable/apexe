# apexe configuration.
#
# This file answers one question: what may a governed command read or write, and
# where. A second question — who may run which command — lives in acl.yaml.
# The three gates are evaluated in this order:
#
#   coverage (bindings)  ->  permission (acl.yaml)  ->  access (this file)
#
# Every gate must admit the call. Allowing `rm` in acl.yaml therefore does not
# let it write to /etc: `paths.read_only` still refuses that write.
#
# Permission vocabularies come from the systems that own these ideas:
#   read_only   systemd ReadOnlyPaths=      may read, may not write
#   read_write  systemd ReadWritePaths=     may read and write
#   no_access   systemd InaccessiblePaths=  neither
#   write_only  AppArmor's `w` right        may write, may not read
#
# Path entries resolve as the kernel resolves them: relative paths are joined to
# the working directory, symlinks are followed, `..` is collapsed. The most
# specific (deepest) matching entry decides; a path may appear in only one list.
# A path in no list is read_write.
#
# `schema_version` is required. A file without it is rejected rather than guessed
# at.
schema_version: 1

# Which built-in defaults this file was seeded from. `apexe config check`
# reports entries the current release ships and this file lacks; it never
# edits the file on its own.
defaults_revision: 1

paths:
  # may read, may not write
  read_only:
    - /bin
    - /boot
    - /dev
    - /etc
    - /lib
    - /lib32
    - /lib64
    - /proc
    - /run
    - /sbin
    - /sys
    - /usr
    - /var
    # macOS system roots
    - /System
    - /Library
    - /Applications
    - /private/etc
    - /private/var
    # apexe's own state: the policy, the audit trail and the recorded security
    # evidence. Legible on purpose — an agent that can read the policy can
    # explain a refusal instead of guessing — and refused to writers, so a
    # wrapped tool cannot rewrite the policy that governs it.
    - ~/.apexe

  # neither read nor write
  no_access:
    - ~/.ssh
    - ~/.aws
    - ~/.gnupg
    - ~/.kube
    - ~/.docker
    - ~/.config/gh
    - ~/.config/gcloud
    - ~/.config/apcore
    - ~/.git-credentials
    - ~/.netrc

  # may write, may not read. Empty by default; it exists so all four
  # combinations of {read, write} have a name.
  write_only: []

  # may read and write. This is the override list: an entry here wins over a
  # shallower read_only/no_access entry above. To open one subtree out of a
  # protected root, name the subtree, not the root:
  #
  #   read_only: [/var]
  #   read_write: [/var/log/myapp]     # /var/log/myapp is writable, /var/log is not
  #
  # Two carve-outs are refused rather than honoured silently: naming / or ~
  # makes every other entry unreachable, which means the file says the opposite
  # of what its author intended.
  read_write: []
