name: Release Binaries

permissions:
  contents: read

on:
  push:
    tags:
      - "rust/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. rust/v0.5.0)"
        required: true

jobs:
  # The tag is what users are handed; the changelog section is what tells them
  # what changed. `rust/v0.7.0` was once tagged while every one of its entries
  # still sat under `## [Unreleased]`, and nothing in this workflow noticed.
  # `cargo test` enforces the same rule on every push (see
  # tests/documentation_consistency.rs), but this workflow runs on a tag and
  # never runs the suite, so the check is repeated where the release happens.
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Changelog has a section for the crate version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "Cargo.toml version: ${version}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${version}]' section." \
                 "Promote '## [Unreleased]' before tagging -- a release with no" \
                 "entries tells its users nothing."
            exit 1
          fi

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/rust/v')
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tagged="${GITHUB_REF#refs/tags/rust/v}"
          if [ "${version}" != "${tagged}" ]; then
            echo "::error::Tag rust/v${tagged} does not match Cargo.toml ${version}."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      # dtolnay/rust-toolchain@stable tracks a rolling branch rather than
      # tagged releases; pinned to the branch HEAD at the time this was added.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="apexe-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/apexe" "$out/"
          cp README.md "$out/" 2>/dev/null || true
          tar -czf "${out}.tar.gz" "$out"
          shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apexe-${{ matrix.target }}
          path: |
            apexe-${{ matrix.target }}.tar.gz
            apexe-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
