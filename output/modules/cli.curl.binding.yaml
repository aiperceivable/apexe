        x-apexe-flag: --local-port
      location_trusted:
        type: boolean
        description: (HTTP) Like -L, --location, but allows sending the name + password to all hosts that the site may redirect to. This may or may not introduce a security breach if the site redirects you to a site to which you send your authentication info (which is clear-text in the case of HTTP Basic authentication).
