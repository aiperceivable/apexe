        x-apexe-flag-aliases:
        - --socks4
        x-apexe-flag: --socks4
      socks4a:
        type: string
        description: Use the specified SOCKS4a proxy. If the port number is not specified, it is assumed at port 1080. This asks the proxy to resolve the host name.
        x-apexe-flag-aliases:
        - --socks4a
        x-apexe-flag: --socks4a
      socks5_basic:
        type: boolean
        description: Tells curl to use username/password authentication when connecting to a SOCKS5 proxy. The username/password authentication is enabled by default. Use --socks5-gssapi to force GSS-API authentication to SOCKS5 proxies.
        default: false
        x-apexe-flag-aliases:
        - --socks5-basic
        x-apexe-flag: --socks5-basic
      socks5_gssapi_nec:
        type: boolean
        description: As part of the GSS-API negotiation a protection mode is negotiated. RFC 1961 says in section 4.3/4.4 it should be protected, but the NEC reference implementation does not. The option --socks5-gssapi-nec allows the unprotected exchange of the protection mode negotiation.
        default: false
        x-apexe-flag-aliases:
        - --socks5-gssapi-nec
        x-apexe-flag: --socks5-gssapi-nec
      socks5_gssapi_service:
        type: string
        description: The default service name for a socks server is rcmd/server-fqdn. This option allows you to change it.
        x-apexe-flag-aliases:
        - --socks5-gssapi-service
        x-apexe-flag: --socks5-gssapi-service
      socks5_gssapi:
        type: boolean
        description: Tells curl to use GSS-API authentication when connecting to a SOCKS5 proxy.  The GSS-API authentication is enabled by default (if curl is compiled with GSS-API support). Use --socks5-basic to force username/password authentication to SOCKS5 proxies.
        default: false
        x-apexe-flag-aliases:
        - --socks5-gssapi
        x-apexe-flag: --socks5-gssapi
      socks5_hostname:
        type: string
        description: Use the specified SOCKS5 proxy (and let the proxy resolve the host name). If the port number is not specified, it is assumed at port 1080.
        x-apexe-flag-aliases:
        - --socks5-hostname
        x-apexe-flag: --socks5-hostname
      socks5:
        type: string
        description: Use the specified SOCKS5 proxy - but resolve the host name locally. If the port number is not specified, it is assumed at port 1080.
        x-apexe-flag-aliases:
        - --socks5
        x-apexe-flag: --socks5
      speed_limit:
        type: string
        description: If a transfer is slower than this set speed (in bytes per second) for a given number of seconds, it gets aborted. The time period is set with -y, --speed-time and is 30 seconds by default.
        x-apexe-flag-aliases:
        - -Y
        - --speed-limit
        x-apexe-flag: --speed-limit
      speed_time:
        type: number
        description: If a transfer runs slower than speed-limit bytes per second during a speed-time period, the transfer is aborted. If speed-time is used, the default speed-limit is 1 unless set with -Y, --speed-limit.
        x-apexe-flag-aliases:
        - -y
        - --speed-time
        x-apexe-flag: --speed-time
      ssl_allow_beast:
        type: boolean
        description: (TLS) This option tells curl to not work around a security flaw in the SSL3 and TLS1.0 protocols known as BEAST. If this option is not used, the SSL layer may use workarounds known to cause interoperability problems with some older SSL implementations.
        default: false
        x-apexe-flag-aliases:
        - --ssl-allow-beast
        x-apexe-flag: --ssl-allow-beast
      ssl_auto_client_cert:
        type: boolean
        description: (TLS) (Schannel) Tell libcurl to automatically locate and use a client certificate for authentication, when requested by the server. Since the server can request any certificate that supports client authentication in the OS certificate store it could be a privacy violation and unexpected.
        default: false
        x-apexe-flag-aliases:
        - --ssl-auto-client-cert
        x-apexe-flag: --ssl-auto-client-cert
      ssl_no_revoke:
        type: boolean
        description: '(TLS) (Schannel) This option tells curl to disable certificate revocation checks.  WARNING: this option loosens the SSL security, and by using this flag you ask for exactly that.'
        default: false
        x-apexe-flag-aliases:
        - --ssl-no-revoke
        x-apexe-flag: --ssl-no-revoke
      ssl_reqd:
        type: boolean
        description: (FTP IMAP POP3 SMTP LDAP) Require SSL/TLS for the connection. Terminates the connection if the transfer cannot be upgraded to use SSL/TLS.
        default: false
        x-apexe-flag-aliases:
        - --ssl-reqd
        x-apexe-flag: --ssl-reqd
      ssl_revoke_best_effort:
        type: boolean
        description: (TLS) (Schannel) This option tells curl to ignore certificate revocation checks when they failed due to missing/offline distribution points for the revocation check lists.
        default: false
        x-apexe-flag-aliases:
        - --ssl-revoke-best-effort
        x-apexe-flag: --ssl-revoke-best-effort
      ssl:
        type: boolean
        description: '(FTP IMAP POP3 SMTP LDAP) Warning: this is considered an insecure option. Consider using --ssl-reqd instead to be sure curl upgrades to a secure connection.'
        default: false
        x-apexe-flag-aliases:
        - --ssl
        x-apexe-flag: --ssl
      sslv2:
        type: boolean
        description: (SSL) This option previously asked curl to use SSLv2, but is now ignored (added in 7.77.0). SSLv2 is widely considered insecure (see RFC 6176).
        default: false
        x-apexe-flag-aliases:
        - '-2'
        - --sslv2
        x-apexe-flag: --sslv2
      sslv3:
        type: boolean
        description: (SSL) This option previously asked curl to use SSLv3, but is now ignored (added in 7.77.0). SSLv3 is widely considered insecure (see RFC 7568).
        default: false
        x-apexe-flag-aliases:
        - '-3'
        - --sslv3
        x-apexe-flag: --sslv3
      stderr:
        type: string
        x-apexe-path: true
        description: Redirect all writes to stderr to the specified file instead. If the file name is a plain '-', it is instead written to stdout.
        x-apexe-flag-aliases:
        - --stderr
        x-apexe-flag: --stderr
      styled_output:
        type: boolean
        description: Enables the automatic use of bold font styles when writing HTTP headers to the terminal. Use --no-styled-output to switch them off.
        default: false
        x-apexe-flag-aliases:
        - --styled-output
        x-apexe-flag: --styled-output
      suppress_connect_headers:
        type: boolean
        description: When -p, --proxytunnel is used and a CONNECT request is made do not output proxy CONNECT response headers. This option is meant to be used with -D, --dump-header or -i, --include which are used to show protocol headers in the output. It has no effect on debug options such as -v, --verbose or --trace, or any statistics.
        default: false
        x-apexe-flag-aliases:
        - --suppress-connect-headers
        x-apexe-flag: --suppress-connect-headers
      tcp_fastopen:
        type: boolean
        description: Enable use of TCP Fast Open (RFC 7413). TCP Fast Open is a TCP extension that allows data to get sent earlier over the connection (before the final handshake ACK) if the client and server have been connected previously.
        default: false
        x-apexe-flag-aliases:
        - --tcp-fastopen
        x-apexe-flag: --tcp-fastopen
      tcp_nodelay:
        type: boolean
        description: Turn on the TCP_NODELAY option. See the curl_easy_setopt(3) man page for details about this option.
        default: false
        x-apexe-flag-aliases:
        - --tcp-nodelay
        x-apexe-flag: --tcp-nodelay
      telnet_option:
        type: string
        description: 'Pass options to the telnet protocol. Supported options are:'
        x-apexe-flag-aliases:
        - -t
        - --telnet-option
        x-apexe-flag: --telnet-option
      tftp_blksize:
        type: string
        description: (TFTP) Set the TFTP BLKSIZE option (must be >512). This is the block size that curl tries to use when transferring data to or from a TFTP server. By default 512 bytes are used.
        x-apexe-flag-aliases:
        - --tftp-blksize
        x-apexe-flag: --tftp-blksize
      tftp_no_options:
        type: boolean
        description: (TFTP) Tells curl not to send TFTP options requests.
        default: false
        x-apexe-flag-aliases:
        - --tftp-no-options
        x-apexe-flag: --tftp-no-options
      time_cond:
        type: string
        description: (HTTP FTP) Request a file that has been modified later than the given time and date, or one that has been modified before that time. The <date expression> can be all sorts of date strings or if it does not match any internal ones, it is taken as a filename and tries to get the modification date (mtime) from <file> instead. See the curl_getdate(3) man pages for date expression details.
        x-apexe-flag-aliases:
        - -z
        - --time-cond
        x-apexe-flag: --time-cond
      tls_max:
        type: string
        description: (TLS) VERSION defines maximum supported TLS version. The minimum acceptable version is set by tlsv1.0, tlsv1.1, tlsv1.2 or tlsv1.3.
        x-apexe-flag-aliases:
        - --tls-max
        x-apexe-flag: --tls-max
      tls13_ciphers:
        type: string
        description: '(TLS) Specifies which cipher suites to use in the connection if it negotiates TLS 1.3. The list of ciphers suites must specify valid ciphers. Read up on TLS 1.3 cipher suite details on this URL:'
        x-apexe-flag-aliases:
        - --tls13-ciphers
        x-apexe-flag: --tls13-ciphers
      tlsauthtype:
        type: string
        description: (TLS) Set TLS authentication type. Currently, the only supported option is "SRP", for TLS-SRP (RFC 5054). If --tlsuser and --tlspassword are specified but --tlsauthtype is not, then this option defaults to "SRP". This option works only if the underlying libcurl is built with TLS-SRP support, which requires OpenSSL or GnuTLS with TLS-SRP support.
        x-apexe-flag-aliases:
        - --tlsauthtype
        x-apexe-flag: --tlsauthtype
        x-sensitive: true
      tlspassword:
        type: string
        description: (TLS) Set password for use with the TLS authentication method specified with --tlsauthtype. Requires that --tlsuser also be set.
        x-apexe-flag-aliases:
        - --tlspassword
        x-apexe-flag: --tlspassword
        x-sensitive: true
      tlsuser:
        type: string
        description: (TLS) Set username for use with the TLS authentication method specified with --tlsauthtype. Requires that --tlspassword also is set.
        x-apexe-flag-aliases:
        - --tlsuser
        x-apexe-flag: --tlsuser
        x-sensitive: true
      tlsv1.0:
        type: boolean
        description: (TLS) Forces curl to use TLS version 1.0 or later when connecting to a remote TLS server.
        default: false
        x-apexe-flag-aliases:
        - --tlsv1.0
        x-apexe-flag: --tlsv1.0
      tlsv1.1:
        type: boolean
        description: (TLS) Forces curl to use TLS version 1.1 or later when connecting to a remote TLS server.
        default: false
        x-apexe-flag-aliases:
        - --tlsv1.1
        x-apexe-flag: --tlsv1.1
      tlsv1.2:
        type: boolean
        description: (TLS) Forces curl to use TLS version 1.2 or later when connecting to a remote TLS server.
        default: false
        x-apexe-flag-aliases:
        - --tlsv1.2
        x-apexe-flag: --tlsv1.2
      tlsv1.3:
        type: boolean
        description: (TLS) Forces curl to use TLS version 1.3 or later when connecting to a remote TLS server.
        default: false
        x-apexe-flag-aliases:
        - --tlsv1.3
        x-apexe-flag: --tlsv1.3
      tlsv1:
        type: boolean
        description: (TLS) Tells curl to use at least TLS version 1.x when negotiating with a remote TLS server. That means TLS version 1.0 or higher
        default: false
        x-apexe-flag-aliases:
        - '-1'
        - --tlsv1
        x-apexe-flag: --tlsv1
      tr_encoding:
        type: boolean
        description: (HTTP) Request a compressed Transfer-Encoding response using one of the algorithms curl supports, and uncompress the data while receiving it.
        default: false
        x-apexe-flag-aliases:
        - --tr-encoding
        x-apexe-flag: --tr-encoding
      trace_ascii:
        type: string
        x-apexe-path: true
        description: Enables a full trace dump of all incoming and outgoing data, including descriptive information, to the given output file. Use "-" as filename to have the output sent to stdout.
        x-apexe-flag-aliases:
        - --trace-ascii
        x-apexe-flag: --trace-ascii
      trace_ids:
        type: boolean
        description: Prepends the transfer and connection identifiers to each trace or verbose line that curl displays.
        default: false
        x-apexe-flag-aliases:
        - --trace-ids
        x-apexe-flag: --trace-ids
      trace_time:
        type: boolean
        description: Prepends a time stamp to each trace or verbose line that curl displays.
        default: false
        x-apexe-flag-aliases:
        - --trace-time
        x-apexe-flag: --trace-time
      unix_socket:
        type: string
        x-apexe-path: true
        description: (HTTP) Connect through this Unix domain socket, instead of using the network.
        x-apexe-flag-aliases:
        - --unix-socket
        x-apexe-flag: --unix-socket
      url_query:
        type: string
        description: '(all) This option adds a piece of data, usually a name + value pair, to the end of the URL query part. The syntax is identical to that used for --data-urlencode with one extension:'
        x-apexe-flag-aliases:
        - --url-query
        x-apexe-flag: --url-query
      url:
        type: string
        x-apexe-positional: 0
        description: Specify a URL to fetch. This option is mostly handy when you want to specify URL(s) in a config file.
      use_ascii:
        type: boolean
        description: (FTP LDAP) Enable ASCII transfer. For FTP, this can also be enforced by using a URL that ends with ";type=A". This option causes data sent to stdout to be in text mode for win32 systems.
        default: false
        x-apexe-flag-aliases:
        - -B
        - --use-ascii
        x-apexe-flag: --use-ascii
      variable:
        type: string
        description: Set a variable with "name=content" or "name@file" (where "file" can be stdin if set to a single dash (-)). The name is a case sensitive identifier that must consist of no other letters than a-z, A-Z, 0-9 or underscore. The specified content is then associated with this identifier.
        x-apexe-flag-aliases:
        - --variable
        x-apexe-flag: --variable
      write_out:
        type: string
        description: Make curl display information on stdout after a completed transfer. The format is a string that may contain plain text mixed with any number of variables. The format can be specified as a literal "string", or you can have curl read the format from a file with "@filename" and to tell curl to read the format from stdin you write "@-".
        x-apexe-flag-aliases:
        - -w
        - --write-out
        x-apexe-flag: --write-out
      xattr:
        type: boolean
        description: When saving output to a file, this option tells curl to store certain file metadata in extended file attributes. Currently, the URL is stored in the "xdg.origin.url" attribute and, for HTTP, the content type is stored in the "mime_type" attribute. If the file system does not support extended attributes, a warning is issued.
        default: false
        x-apexe-flag-aliases:
        - --xattr
        x-apexe-flag: --xattr
      url_option:
        type: string
        format: uri
        description: Specify a URL to fetch. This option is mostly handy when you want to specify URL(s) in a config file.
        x-apexe-flag-aliases:
        - --url
        x-apexe-flag: --url
    additionalProperties: false
    required:
    - url
  output_schema:
    type: object
    properties:
      stdout:
        type: string
        description: Standard output from the command
      stderr:
        type: string
        description: Standard error output from the command
      exit_code:
        type: integer
        description: Process exit code (0 = success)
    required:
    - stdout
    - stderr
    - exit_code
