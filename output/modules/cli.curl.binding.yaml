            default: false
            x-apexe-flag-aliases:
            - --post301
            x-apexe-flag: --post301
          post302:
            type: boolean
            description: (HTTP) Tells curl to respect RFC 7231/6.4.3 and not convert POST requests into GET requests when following a 302 redirection. The non-RFC behavior is ubiquitous in web browsers, so curl does the conversion by default to maintain consistency. However, a server may require a POST to remain a POST after such a redirection. This option is meaningful only when using -L, --location.
            default: false
            x-apexe-flag-aliases:
            - --post302
            x-apexe-flag: --post302
          post303:
            type: boolean
            description: (HTTP) Tells curl to violate RFC 7231/6.4.4 and not convert POST requests into GET requests when following 303 redirections. A server may require a POST to remain a POST after a 303 redirection. This option is meaningful only when using -L, --location.
            default: false
            x-apexe-flag-aliases:
            - --post303
            x-apexe-flag: --post303
          preproxy:
            type: string
