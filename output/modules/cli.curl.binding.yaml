            x-apexe-flag: --no-alpn
          no_buffer:
            type: boolean
            description: Disables the buffering of the output stream. In normal work situations, curl uses a standard buffered output stream that has the effect that it outputs the data in chunks, not necessarily exactly when the data arrives. Using this option disables that buffering.
            default: false
            x-apexe-flag-aliases:
