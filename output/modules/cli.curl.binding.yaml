        x-apexe-flag: --etag-compare
      etag_save:
        type: string
        x-apexe-path: true
        description: (HTTP) This option saves an HTTP ETag to the specified file. An ETag is a caching related header, usually returned in a response.
        x-apexe-flag-aliases:
        - --etag-save
        x-apexe-flag: --etag-save
      expect100_timeout:
        type: number
        description: '(HTTP) Maximum time in seconds that you allow curl to wait for a 100-continue response when curl emits an Expects: 100-continue header in its request. By default curl waits one second. This option accepts decimal values! When curl stops waiting, it continues as if the response has been received.'
        x-apexe-flag-aliases:
        - --expect100-timeout
        x-apexe-flag: --expect100-timeout
      fail_early:
        type: boolean
        description: Fail and exit on the first detected transfer error.
        default: false
        x-apexe-flag-aliases:
        - --fail-early
        x-apexe-flag: --fail-early
      fail_with_body:
        type: boolean
        description: (HTTP) Return an error on server errors where the HTTP response code is 400 or greater). In normal cases when an HTTP server fails to deliver a document, it returns an HTML document stating so (which often also describes why and more). This flag allows curl to output and save that content but also to return error 22.
        default: false
        x-apexe-flag-aliases:
