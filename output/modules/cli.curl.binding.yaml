        description: (HTTP FTP) Write the received protocol headers to the specified file. If no headers are received, the use of this option creates an empty file.
        x-apexe-flag-aliases:
        - -D
        - --dump-header
        x-apexe-flag: --dump-header
        x-sensitive: true
      egd_file:
        type: string
        x-apexe-path: true
        description: (TLS) Deprecated option (added in 7.84.0). Prior to that it only had an effect on curl if built to use old versions of OpenSSL.
        x-apexe-flag-aliases:
        - --egd-file
        x-apexe-flag: --egd-file
      engine:
        type: string
        description: (TLS) Select the OpenSSL crypto engine to use for cipher operations. Use --engine list to print a list of build-time supported engines. Note that not all (and possibly none) of the engines may be available at runtime.
        x-apexe-flag-aliases:
        - --engine
        x-apexe-flag: --engine
      etag_compare:
        type: string
        x-apexe-path: true
        description: (HTTP) This option makes a conditional HTTP request for the specific ETag read from the given file by sending a custom If-None-Match header using the stored ETag.
        x-apexe-flag-aliases:
