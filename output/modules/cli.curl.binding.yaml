        default: false
        x-apexe-flag-aliases:
        - -L
        - --location
        x-apexe-flag: --location
      login_options:
        type: string
        description: (IMAP LDAP POP3 SMTP) Specify the login options to use during server authentication.
        x-apexe-flag-aliases:
        - --login-options
        x-apexe-flag: --login-options
        x-sensitive: true
      mail_auth:
        type: string
        description: (SMTP) Specify a single address. This is used to specify the authentication address (identity) of a submitted message that is being relayed to another server.
        x-apexe-flag-aliases:
        - --mail-auth
        x-apexe-flag: --mail-auth
        x-sensitive: true
      mail_from:
        type: string
        description: (SMTP) Specify a single address that the given mail should get sent from.
        x-apexe-flag-aliases:
        - --mail-from
        x-apexe-flag: --mail-from
      mail_rcpt_allowfails:
        type: boolean
        description: (SMTP) When sending data to multiple recipients, by default curl aborts SMTP conversation if at least one of the recipients causes RCPT TO command to return an error.
        default: false
        x-apexe-flag-aliases:
        - --mail-rcpt-allowfails
        x-apexe-flag: --mail-rcpt-allowfails
      mail_rcpt:
        type: string
        description: (SMTP) Specify a single email address, user name or mailing list name. Repeat this option several times to send to multiple recipients.
        x-apexe-flag-aliases:
        - --mail-rcpt
        x-apexe-flag: --mail-rcpt
        x-sensitive: true
      manual:
        type: boolean
        description: Manual. Display the huge help text.
        default: false
        x-apexe-flag-aliases:
        - -M
        - --manual
        x-apexe-flag: --manual
      max_filesize:
        type: string
        description: (FTP HTTP MQTT) Specify the maximum size (in bytes) of a file to download. If the file requested is larger than this value, the transfer does not start and curl returns with exit code 63.
        x-apexe-flag-aliases:
        - --max-filesize
        x-apexe-flag: --max-filesize
      max_redirs:
        type: integer
        description: (HTTP) Set maximum number of redirections to follow. When -L, --location is used, to prevent curl from following too many redirects, by default, the limit is set to 50 redirects. Set this option to -1 to make it unlimited.
        x-apexe-flag-aliases:
        - --max-redirs
        x-apexe-flag: --max-redirs
      max_time:
        type: number
        description: Maximum time in seconds that you allow each transfer to take. This is useful for preventing your batch jobs from hanging for hours due to slow networks or links going down. This option accepts decimal values.
        x-apexe-flag-aliases:
        - -m
        - --max-time
        x-apexe-flag: --max-time
      metalink:
        type: boolean
        description: This option was previously used to specify a Metalink resource. Metalink support is disabled in curl for security reasons (added in 7.78.0).
        default: false
        x-apexe-flag-aliases:
        - --metalink
        x-apexe-flag: --metalink
      negotiate:
        type: boolean
        description: (HTTP) Enables Negotiate (SPNEGO) authentication.
        default: false
        x-apexe-flag-aliases:
        - --negotiate
        x-apexe-flag: --negotiate
      netrc_file:
        type: string
        x-apexe-path: true
        description: This option is similar to -n, --netrc, except that you provide the path (absolute or relative) to the netrc file that curl should use. You can only specify one netrc file per invocation.
        x-apexe-flag-aliases:
        - --netrc-file
        x-apexe-flag: --netrc-file
        x-sensitive: true
      netrc_optional:
        type: boolean
        description: Similar to -n, --netrc, but this option makes the .netrc usage optional and not mandatory as the -n, --netrc option does.
        default: false
        x-apexe-flag-aliases:
        - --netrc-optional
        x-apexe-flag: --netrc-optional
      netrc:
        type: boolean
        description: Makes curl scan the .netrc file in the user's home directory for login name and password. This is typically used for FTP on Unix. If used with HTTP, curl enables user authentication. See netrc(5) and ftp(1) for details on the file format. Curl does not complain if that file does not have the right permissions (it should be neither world- nor group-readable). The environment variable "HOME" is used to find the home directory.
