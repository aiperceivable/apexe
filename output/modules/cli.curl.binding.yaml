        x-apexe-flag: --doh-cert-status
      doh_insecure:
        type: boolean
        description: Same as -k, --insecure but used for DoH (DNS-over-HTTPS).
        default: false
        x-apexe-flag-aliases:
        - --doh-insecure
        x-apexe-flag: --doh-insecure
      doh_url:
        type: string
        format: uri
        description: Specifies which DNS-over-HTTPS (DoH) server to use to resolve hostnames, instead of using the default name resolver mechanism. The URL must be HTTPS.
        x-apexe-flag-aliases:
        - --doh-url
        x-apexe-flag: --doh-url
      dump_header:
        type: string
