        x-apexe-flag: --proxy-tlsauthtype
      proxy_tlspassword:
        type: string
        description: Same as --tlspassword but used in HTTPS proxy context.
        x-apexe-flag-aliases:
        - --proxy-tlspassword
        x-apexe-flag: --proxy-tlspassword
        x-sensitive: true
      proxy_tlsuser:
        type: string
        description: Same as --tlsuser but used in HTTPS proxy context.
