        x-apexe-flag: --dns-ipv4-addr
      dns_ipv6_addr:
        type: string
        description: (DNS) Tell curl to bind to a specific IP address when making IPv6 DNS requests, so that the DNS requests originate from this address. The argument should be a single IPv6 address.
        x-apexe-flag-aliases:
        - --dns-ipv6-addr
        x-apexe-flag: --dns-ipv6-addr
      dns_servers:
        type: string
        description: (DNS) Set the list of DNS servers to be used instead of the system default.  The list of IP addresses should be separated with commas. Port numbers may also optionally be given as :<port-number> after each IP address.
        x-apexe-flag-aliases:
