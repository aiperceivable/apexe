        - --krb
        x-apexe-flag: --krb
      libcurl:
        type: string
        x-apexe-path: true
        description: Append this option to any ordinary curl command line, and you get libcurl-using C source code written to the file that does the equivalent of what your command-line operation does!
        x-apexe-flag-aliases:
        - --libcurl
        x-apexe-flag: --libcurl
      limit_rate:
        type: string
        description: Specify the maximum transfer rate you want curl to use - for both downloads and uploads. This feature is useful if you have a limited pipe and you would like your transfer not to use your entire bandwidth. To make it slower than it otherwise would be.
        x-apexe-flag-aliases:
        - --limit-rate
        x-apexe-flag: --limit-rate
      list_only:
        type: boolean
        description: (FTP POP3 SFTP) (FTP) When listing an FTP directory, this switch forces a name-only view. This is especially useful if the user wants to machine-parse the contents of an FTP directory since the normal directory view does not use a standard look or format. When used like this, the option causes an NLST command to be sent to the server instead of LIST.
