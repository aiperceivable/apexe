            x-apexe-flag: --ntlm-wb
          ntlm:
            type: boolean
            description: (HTTP) Enables NTLM authentication. The NTLM authentication method was designed by Microsoft and is used by IIS web servers. It is a proprietary protocol, reverse-engineered by clever people and implemented in curl based on their efforts. This kind of behavior should not be endorsed, you should encourage everyone who uses NTLM to switch to a public and documented authentication method instead, such as Digest.
            default: false
            x-apexe-flag-aliases:
            - --ntlm
            x-apexe-flag: --ntlm
          oauth2_bearer:
            type: string
            description: (IMAP LDAP POP3 SMTP HTTP) Specify the Bearer Token for OAUTH 2.0 server authentication. The Bearer Token is used in conjunction with the user name which can be specified as part of the --url or -u, --user options.
            x-apexe-flag-aliases:
            - --oauth2-bearer
            x-apexe-flag: --oauth2-bearer
            x-sensitive: true
          output_dir:
            type: string
            x-apexe-path: true
            description: This option specifies the directory in which files should be stored, when -O, --remote-name or -o, --output are used.
            x-apexe-flag-aliases:
            - --output-dir
            x-apexe-flag: --output-dir
          parallel_immediate:
            type: boolean
            description: When doing parallel transfers, this option instructs curl that it should rather prefer opening up more connections in parallel at once rather than waiting to see if new transfers can be added as multiplexed streams on another connection.
            default: false
            x-apexe-flag-aliases:
            - --parallel-immediate
            x-apexe-flag: --parallel-immediate
          parallel_max:
            type: integer
            description: When asked to do parallel transfers, using -Z, --parallel, this option controls the maximum amount of transfers to do simultaneously.
            x-apexe-flag-aliases:
            - --parallel-max
            x-apexe-flag: --parallel-max
          pass:
            type: string
            description: (SSH TLS) Passphrase for the private key.
            x-apexe-flag-aliases:
            - --pass
            x-apexe-flag: --pass
            x-sensitive: true
          path_as_is:
            type: boolean
            description: Tell curl to not handle sequences of /../ or /./ in the given URL path. Normally curl squashes or merges them according to standards but with this option set you tell it not to do that.
            default: false
            x-apexe-flag-aliases:
            - --path-as-is
            x-apexe-flag: --path-as-is
          pinnedpubkey:
            type: string
            description: (TLS) Tells curl to use the specified public key file (or hashes) to verify the peer. This can be a path to a file which contains a single public key in PEM or DER format, or any number of base64 encoded sha256 hashes preceded by 'sha256//' and separated by ';'.
            x-apexe-flag-aliases:
            - --pinnedpubkey
            x-apexe-flag: --pinnedpubkey
          post301:
