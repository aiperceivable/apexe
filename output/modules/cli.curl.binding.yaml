        x-apexe-flag: --fail-with-body
      false_start:
        type: boolean
        description: (TLS) Tells curl to use false start during the TLS handshake. False start is a mode where a TLS client starts sending application data before verifying the server's Finished message, thus saving a round trip when performing a full handshake.
        default: false
        x-apexe-flag-aliases:
        - --false-start
        x-apexe-flag: --false-start
      form_escape:
        type: boolean
        description: (HTTP) Tells curl to pass on names of multipart form fields and files using backslash-escaping instead of percent-encoding.
