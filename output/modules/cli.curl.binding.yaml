          happy_eyeballs_timeout_ms:
            type: number
            description: Happy Eyeballs is an algorithm that attempts to connect to both IPv4 and IPv6 addresses for dual-stack hosts, giving IPv6 a head-start of the specified number of milliseconds. If the IPv6 address cannot be connected to within that time, then a connection attempt is made to the IPv4 address in parallel. The first connection to be established is the one that is used.
            x-apexe-flag-aliases:
            - --happy-eyeballs-timeout-ms
            x-apexe-flag: --happy-eyeballs-timeout-ms
          haproxy_clientip:
            type: string
            description: (HTTP) Sets a client IP in HAProxy PROXY protocol v1 header at the beginning of the connection.
            x-apexe-flag-aliases:
            - --haproxy-clientip
            x-apexe-flag: --haproxy-clientip
          haproxy_protocol:
            type: boolean
            description: (HTTP) Send a HAProxy PROXY protocol v1 header at the beginning of the connection. This is used by some load balancers and reverse proxies to indicate the client's true IP address and port.
            default: false
            x-apexe-flag-aliases:
            - --haproxy-protocol
            x-apexe-flag: --haproxy-protocol
          head:
            type: boolean
            description: (HTTP FTP FILE) Fetch the headers only! HTTP-servers feature the command HEAD which this uses to get nothing but the header of a document. When used on an FTP or FILE file, curl displays the file size and last modification time only.
            default: false
            x-apexe-flag-aliases:
            - -I
            - --head
            x-apexe-flag: --head
          header:
            type: string
            description: (HTTP IMAP SMTP) Extra header to include in information sent. When used within an HTTP request, it is added to the regular request headers.
            x-apexe-flag-aliases:
            - -H
            - --header
            x-apexe-flag: --header
            x-sensitive: true
          hostpubmd5:
            type: string
            description: (SFTP SCP) Pass a string containing 32 hexadecimal digits. The string should be the 128 bit MD5 checksum of the remote host's public key, curl refuses the connection with the host unless the checksums match.
            x-apexe-flag-aliases:
            - --hostpubmd5
            x-apexe-flag: --hostpubmd5
          hostpubsha256:
            type: string
            description: (SFTP SCP) Pass a string containing a Base64-encoded SHA256 hash of the remote host's public key. Curl refuses the connection with the host unless the hashes match.
            x-apexe-flag-aliases:
            - --hostpubsha256
            x-apexe-flag: --hostpubsha256
          hsts:
            type: string
            x-apexe-path: true
            description: (HTTPS) This option enables HSTS for the transfer. If the file name points to an existing HSTS cache file, that is used. After a completed transfer, the cache is saved to the file name again if it has been modified.
            x-apexe-flag-aliases:
            - --hsts
            x-apexe-flag: --hsts
          http0.9:
            type: boolean
            description: (HTTP) Tells curl to be fine with HTTP version 0.9 response.
            default: false
            x-apexe-flag-aliases:
            - --http0.9
            x-apexe-flag: --http0.9
          http1.0:
            type: boolean
            description: (HTTP) Tells curl to use HTTP version 1.0 instead of using its internally preferred HTTP version.
            default: false
            x-apexe-flag-aliases:
            - '-0'
            - --http1.0
            x-apexe-flag: --http1.0
          http1.1:
            type: boolean
            description: (HTTP) Tells curl to use HTTP version 1.1.
            default: false
            x-apexe-flag-aliases:
            - --http1.1
            x-apexe-flag: --http1.1
          http2_prior_knowledge:
            type: boolean
            description: (HTTP) Tells curl to issue its non-TLS HTTP requests using HTTP/2 without HTTP/1.1 Upgrade. It requires prior knowledge that the server supports HTTP/2 straight away. HTTPS requests still do HTTP/2 the standard way with negotiated protocol version in the TLS handshake.
            default: false
            x-apexe-flag-aliases:
            - --http2-prior-knowledge
            x-apexe-flag: --http2-prior-knowledge
          http2:
            type: boolean
            description: (HTTP) Tells curl to use HTTP version 2.
            default: false
            x-apexe-flag-aliases:
            - --http2
            x-apexe-flag: --http2
          http3_only:
            type: boolean
            description: (HTTP) Instructs curl to use HTTP/3 to the host in the URL, with no fallback to earlier HTTP versions. HTTP/3 can only be used for HTTPS and not for HTTP URLs. For HTTP, this option triggers an error.
            default: false
            x-apexe-flag-aliases:
            - --http3-only
            x-apexe-flag: --http3-only
          http3:
            type: boolean
            description: (HTTP) Tells curl to try HTTP/3 to the host in the URL, but fallback to earlier HTTP versions if the HTTP/3 connection establishment fails. HTTP/3 is only available for HTTPS and not for HTTP URLs.
            default: false
            x-apexe-flag-aliases:
            - --http3
            x-apexe-flag: --http3
          ignore_content_length:
            type: boolean
            description: (FTP HTTP) For HTTP, Ignore the Content-Length header. This is particularly useful for servers running Apache 1.x, which reports incorrect Content-Length for files larger than 2 gigabytes.
            default: false
            x-apexe-flag-aliases:
            - --ignore-content-length
            x-apexe-flag: --ignore-content-length
          insecure:
            type: boolean
            description: (TLS SFTP SCP) By default, every secure connection curl makes is verified to be secure before the transfer takes place. This option makes curl skip the verification step and proceed without checking.
            default: false
            x-apexe-flag-aliases:
            - -k
            - --insecure
            x-apexe-flag: --insecure
          interface:
            type: string
            description: 'Perform an operation using a specified interface. You can enter interface name, IP address or host name. An example could look like:'
            x-apexe-flag-aliases:
            - --interface
            x-apexe-flag: --interface
          ipfs_gateway:
            type: string
            format: uri
            description: (IPFS) Specify which gateway to use for IPFS and IPNS URLs. Not specifying this will instead make curl check if the IPFS_GATEWAY environment variable is set, or if a "~/.ipfs/gateway" file holding the gateway URL exists.
            x-apexe-flag-aliases:
            - --ipfs-gateway
            x-apexe-flag: --ipfs-gateway
          ipv4:
            type: boolean
            description: This option tells curl to use IPv4 addresses only when resolving host names, and not for example try IPv6.
            default: false
            x-apexe-flag-aliases:
            - '-4'
            - --ipv4
            x-apexe-flag: --ipv4
          ipv6:
            type: boolean
            description: This option tells curl to use IPv6 addresses only when resolving host names, and not for example try IPv4.
            default: false
            x-apexe-flag-aliases:
            - '-6'
            - --ipv6
            x-apexe-flag: --ipv6
          json:
            type: string
            description: '(HTTP) Sends the specified JSON data in a POST request to the HTTP server. --json works as a shortcut for passing on these three options:'
            x-apexe-flag-aliases:
            - --json
            x-apexe-flag: --json
          junk_session_cookies:
            type: boolean
            description: (HTTP) When curl is told to read cookies from a given file, this option makes it discard all "session cookies". This has the same effect as if a new session is started. Typical browsers discard session cookies when they are closed down.
            default: false
            x-apexe-flag-aliases:
            - -j
            - --junk-session-cookies
            x-apexe-flag: --junk-session-cookies
          keepalive_time:
            type: number
            description: This option sets the time a connection needs to remain idle before sending keepalive probes and the time between individual keepalive probes. It is currently effective on operating systems offering the "TCP_KEEPIDLE" and "TCP_KEEPINTVL" socket options (meaning Linux, recent AIX, HP-UX and more).  Keepalive is used by the TCP stack to detect broken networks on idle connections. The number of missed keepalive probes before declaring the connection down is OS dependent and is commonly 9 or 10. This option has no effect if --no-keepalive is used.
            x-apexe-flag-aliases:
            - --keepalive-time
            x-apexe-flag: --keepalive-time
          key_type:
            type: string
            description: (TLS) Private key file type. Specify which type your --key provided private key is. DER, PEM, and ENG are supported. If not specified, PEM is assumed.
            x-apexe-flag-aliases:
            - --key-type
            x-apexe-flag: --key-type
            x-sensitive: true
          key:
            type: string
            description: '(TLS SSH) Private key file name. Allows you to provide your private key in this separate file. For SSH, if not specified, curl tries the following candidates in order: "~/.ssh/id_rsa", "~/.ssh/id_dsa", "./id_rsa", "./id_dsa".'
            x-apexe-flag-aliases:
            - --key
            x-apexe-flag: --key
            x-sensitive: true
          krb:
            type: string
            description: (FTP) Enable Kerberos authentication and use. The level must be entered and should be one of 'clear', 'safe', 'confidential', or 'private'. Should you use a level that is not one of these, 'private' is used.
            x-apexe-flag-aliases:
            - --krb
            x-apexe-flag: --krb
          libcurl:
            type: string
            x-apexe-path: true
            description: Append this option to any ordinary curl command line, and you get libcurl-using C source code written to the file that does the equivalent of what your command-line operation does!
            x-apexe-flag-aliases:
            - --libcurl
            x-apexe-flag: --libcurl
          limit_rate:
            type: string
            description: Specify the maximum transfer rate you want curl to use - for both downloads and uploads. This feature is useful if you have a limited pipe and you would like your transfer not to use your entire bandwidth. To make it slower than it otherwise would be.
            x-apexe-flag-aliases:
            - --limit-rate
            x-apexe-flag: --limit-rate
          list_only:
            type: boolean
            description: (FTP POP3 SFTP) (FTP) When listing an FTP directory, this switch forces a name-only view. This is especially useful if the user wants to machine-parse the contents of an FTP directory since the normal directory view does not use a standard look or format. When used like this, the option causes an NLST command to be sent to the server instead of LIST.
            default: false
            x-apexe-flag-aliases:
            - -l
            - --list-only
            x-apexe-flag: --list-only
          local_port:
            type: string
            description: Set a preferred single number or range (FROM-TO) of local port numbers to use for the connection(s). Note that port numbers by nature are a scarce resource so setting this range to something too narrow might cause unnecessary connection setup failures.
            x-apexe-flag-aliases:
            - --local-port
            x-apexe-flag: --local-port
          location_trusted:
            type: boolean
            description: (HTTP) Like -L, --location, but allows sending the name + password to all hosts that the site may redirect to. This may or may not introduce a security breach if the site redirects you to a site to which you send your authentication info (which is clear-text in the case of HTTP Basic authentication).
            default: false
            x-apexe-flag-aliases:
            - --location-trusted
            x-apexe-flag: --location-trusted
          location:
            type: boolean
            description: '(HTTP) If the server reports that the requested page has moved to a different location (indicated with a Location: header and a 3XX response code), this option makes curl redo the request on the new place. If used together with -i, --include or -I, --head, headers from all requested pages are shown.'
            default: false
            x-apexe-flag-aliases:
            - -L
            - --location
            x-apexe-flag: --location
          login_options:
            type: string
            description: (IMAP LDAP POP3 SMTP) Specify the login options to use during server authentication.
            x-apexe-flag-aliases:
            - --login-options
            x-apexe-flag: --login-options
            x-sensitive: true
          mail_auth:
            type: string
            description: (SMTP) Specify a single address. This is used to specify the authentication address (identity) of a submitted message that is being relayed to another server.
            x-apexe-flag-aliases:
            - --mail-auth
            x-apexe-flag: --mail-auth
            x-sensitive: true
          mail_from:
            type: string
            description: (SMTP) Specify a single address that the given mail should get sent from.
            x-apexe-flag-aliases:
            - --mail-from
            x-apexe-flag: --mail-from
          mail_rcpt_allowfails:
            type: boolean
            description: (SMTP) When sending data to multiple recipients, by default curl aborts SMTP conversation if at least one of the recipients causes RCPT TO command to return an error.
            default: false
            x-apexe-flag-aliases:
            - --mail-rcpt-allowfails
            x-apexe-flag: --mail-rcpt-allowfails
          mail_rcpt:
            type: string
            description: (SMTP) Specify a single email address, user name or mailing list name. Repeat this option several times to send to multiple recipients.
            x-apexe-flag-aliases:
            - --mail-rcpt
            x-apexe-flag: --mail-rcpt
            x-sensitive: true
          manual:
            type: boolean
            description: Manual. Display the huge help text.
            default: false
            x-apexe-flag-aliases:
            - -M
            - --manual
            x-apexe-flag: --manual
          max_filesize:
            type: string
            description: (FTP HTTP MQTT) Specify the maximum size (in bytes) of a file to download. If the file requested is larger than this value, the transfer does not start and curl returns with exit code 63.
            x-apexe-flag-aliases:
            - --max-filesize
            x-apexe-flag: --max-filesize
          max_redirs:
            type: integer
            description: (HTTP) Set maximum number of redirections to follow. When -L, --location is used, to prevent curl from following too many redirects, by default, the limit is set to 50 redirects. Set this option to -1 to make it unlimited.
            x-apexe-flag-aliases:
            - --max-redirs
            x-apexe-flag: --max-redirs
          max_time:
            type: number
            description: Maximum time in seconds that you allow each transfer to take. This is useful for preventing your batch jobs from hanging for hours due to slow networks or links going down. This option accepts decimal values.
            x-apexe-flag-aliases:
            - -m
            - --max-time
            x-apexe-flag: --max-time
          metalink:
            type: boolean
            description: This option was previously used to specify a Metalink resource. Metalink support is disabled in curl for security reasons (added in 7.78.0).
            default: false
            x-apexe-flag-aliases:
            - --metalink
            x-apexe-flag: --metalink
          negotiate:
            type: boolean
            description: (HTTP) Enables Negotiate (SPNEGO) authentication.
            default: false
            x-apexe-flag-aliases:
            - --negotiate
            x-apexe-flag: --negotiate
          netrc_file:
            type: string
            x-apexe-path: true
            description: This option is similar to -n, --netrc, except that you provide the path (absolute or relative) to the netrc file that curl should use. You can only specify one netrc file per invocation.
            x-apexe-flag-aliases:
            - --netrc-file
            x-apexe-flag: --netrc-file
            x-sensitive: true
          netrc_optional:
            type: boolean
            description: Similar to -n, --netrc, but this option makes the .netrc usage optional and not mandatory as the -n, --netrc option does.
            default: false
            x-apexe-flag-aliases:
            - --netrc-optional
            x-apexe-flag: --netrc-optional
          netrc:
            type: boolean
            description: Makes curl scan the .netrc file in the user's home directory for login name and password. This is typically used for FTP on Unix. If used with HTTP, curl enables user authentication. See netrc(5) and ftp(1) for details on the file format. Curl does not complain if that file does not have the right permissions (it should be neither world- nor group-readable). The environment variable "HOME" is used to find the home directory.
            default: false
            x-apexe-flag-aliases:
            - -n
            - --netrc
            x-apexe-flag: --netrc
          next:
            type: boolean
            description: Tells curl to use a separate operation for the following URL and associated options. This allows you to send several URL requests, each with their own specific options, for example, such as different user names or custom requests for each.
            default: false
            x-apexe-flag-aliases:
