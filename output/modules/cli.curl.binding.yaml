            - --no-buffer
            x-apexe-flag: --no-buffer
          no_clobber:
            type: boolean
            description: When used in conjunction with the -o, --output, -J, --remote-header-name, -O, --remote-name, or --remote-name-all options, curl avoids overwriting files that already exist. Instead, a dot and a number gets appended to the name of the file that would be created, up to filename.100 after which it does not create any file.
            default: false
            x-apexe-flag-aliases:
            - --no-clobber
            x-apexe-flag: --no-clobber
          no_keepalive:
            type: boolean
            description: Disables the use of keepalive messages on the TCP connection. curl otherwise enables them by default.
            default: false
            x-apexe-flag-aliases:
            - --no-keepalive
            x-apexe-flag: --no-keepalive
          no_npn:
            type: boolean
            description: (HTTPS) curl never uses NPN, this option has no effect (added in 7.86.0).
            default: false
            x-apexe-flag-aliases:
            - --no-npn
            x-apexe-flag: --no-npn
          no_progress_meter:
            type: boolean
            description: Option to switch off the progress meter output without muting or otherwise affecting warning and informational messages like -s, --silent does.
            default: false
            x-apexe-flag-aliases:
            - --no-progress-meter
            x-apexe-flag: --no-progress-meter
          no_sessionid:
            type: boolean
            description: (TLS) Disable curl's use of SSL session-ID caching. By default all transfers are done using the cache. Note that while nothing should ever get hurt by attempting to reuse SSL session-IDs, there seem to be broken SSL implementations in the wild that may require you to disable this in order for you to succeed.
            default: false
            x-apexe-flag-aliases:
            - --no-sessionid
            x-apexe-flag: --no-sessionid
          noproxy:
            type: string
            description: Comma-separated list of hosts for which not to use a proxy, if one is specified. The only wildcard is a single "*" character, which matches all hosts, and effectively disables the proxy. Each name in this list is matched as either a domain which contains the hostname, or the hostname itself. For example, "local.com" would match "local.com", "local.com:80", and "www.local.com", but not "www.notlocal.com".
            x-apexe-flag-aliases:
            - --noproxy
            x-apexe-flag: --noproxy
          ntlm_wb:
            type: boolean
            description: (HTTP) Enables NTLM much in the style --ntlm does, but hand over the authentication to the separate binary "ntlmauth" application that is executed when needed.
            default: false
            x-apexe-flag-aliases:
