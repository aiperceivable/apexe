        x-apexe-flag-aliases:
        - --form-escape
        x-apexe-flag: --form-escape
      form_string:
        type: string
        description: (HTTP SMTP IMAP) Similar to -F, --form except that the value string for the named parameter is used literally. Leading '@' and '<' characters, and the ';type=' string in the value have no special meaning. Use this in preference to -F, --form if there is any possibility that the string value may accidentally trigger the '@' or '<' features of -F, --form.
        x-apexe-flag-aliases:
        - --form-string
        x-apexe-flag: --form-string
      form:
        type: string
        description: (HTTP SMTP IMAP) For HTTP protocol family, this lets curl emulate a filled-in form in which a user has pressed the submit button. This causes curl to POST data using the Content-Type multipart/form-data according to RFC 2388.
        x-apexe-flag-aliases:
        - -F
        - --form
        x-apexe-flag: --form
      ftp_account:
        type: string
        description: (FTP) When an FTP server asks for "account data" after user name and password has been provided, this data is sent off using the ACCT command.
        x-apexe-flag-aliases:
        - --ftp-account
        x-apexe-flag: --ftp-account
        x-sensitive: true
      ftp_alternative_to_user:
        type: string
        description: (FTP) If authenticating with the USER and PASS commands fails, send this command.  When connecting to Tumbleweed's Secure Transport server over FTPS using a client certificate, using "SITE AUTH" tells the server to retrieve the username from the certificate.
        x-apexe-flag-aliases:
        - --ftp-alternative-to-user
        x-apexe-flag: --ftp-alternative-to-user
        x-sensitive: true
      ftp_create_dirs:
        type: boolean
        description: (FTP SFTP) When an FTP or SFTP URL/operation uses a path that does not currently exist on the server, the standard behavior of curl is to fail. Using this option, curl instead attempts to create missing directories.
        default: false
        x-apexe-flag-aliases:
        - --ftp-create-dirs
        x-apexe-flag: --ftp-create-dirs
      ftp_method:
        type: string
        description: '(FTP) Control what method curl should use to reach a file on an FTP(S) server. The method argument should be one of the following alternatives:'
        x-apexe-flag-aliases:
        - --ftp-method
        x-apexe-flag: --ftp-method
      ftp_pasv:
        type: boolean
        description: (FTP) Use passive mode for the data connection. Passive is the internal default behavior, but using this option can be used to override a previous -P, --ftp-port option.
        default: false
        x-apexe-flag-aliases:
        - --ftp-pasv
        x-apexe-flag: --ftp-pasv
      ftp_port:
        type: string
        description: '(FTP) Reverses the default initiator/listener roles when connecting with FTP. This option makes curl use active mode. curl then tells the server to connect back to the client''s specified address and port, while passive mode asks the server to setup an IP address and port for it to connect to. <address> should be one of:'
        x-apexe-flag-aliases:
        - -P
        - --ftp-port
        x-apexe-flag: --ftp-port
      ftp_pret:
        type: boolean
        description: (FTP) Tell curl to send a PRET command before PASV (and EPSV). Certain FTP servers, mainly drftpd, require this non-standard command for directory listings as well as up and downloads in PASV mode.
        default: false
        x-apexe-flag-aliases:
        - --ftp-pret
        x-apexe-flag: --ftp-pret
      ftp_skip_pasv_ip:
        type: boolean
        description: (FTP) Tell curl to not use the IP address the server suggests in its response to curl's PASV command when curl connects the data connection. Instead curl reuses the same IP address it already uses for the control connection.
        default: false
        x-apexe-flag-aliases:
        - --ftp-skip-pasv-ip
        x-apexe-flag: --ftp-skip-pasv-ip
      ftp_ssl_ccc_mode:
        type: string
        description: (FTP) Sets the CCC mode. The passive mode does not initiate the shutdown, but instead waits for the server to do it, and does not reply to the shutdown from the server. The active mode initiates the shutdown and waits for a reply from the server.
        x-apexe-flag-aliases:
        - --ftp-ssl-ccc-mode
        x-apexe-flag: --ftp-ssl-ccc-mode
      ftp_ssl_ccc:
        type: boolean
        description: (FTP) Use CCC (Clear Command Channel) Shuts down the SSL/TLS layer after authenticating. The rest of the control channel communication is be unencrypted. This allows NAT routers to follow the FTP transaction. The default mode is passive.
        default: false
        x-apexe-flag-aliases:
        - --ftp-ssl-ccc
        x-apexe-flag: --ftp-ssl-ccc
      ftp_ssl_control:
        type: boolean
        description: (FTP) Require SSL/TLS for the FTP login, clear for transfer. Allows secure authentication, but non-encrypted data transfers for efficiency. Fails the transfer if the server does not support SSL/TLS.
        default: false
        x-apexe-flag-aliases:
        - --ftp-ssl-control
        x-apexe-flag: --ftp-ssl-control
      get:
        type: boolean
        description: (HTTP) When used, this option makes all data specified with -d, --data, --data-binary or --data-urlencode to be used in an HTTP GET request instead of the POST request that otherwise would be used. The data is appended to the URL with a '?' separator.
        default: false
        x-apexe-flag-aliases:
        - -G
        - --get
        x-apexe-flag: --get
      globoff:
        type: boolean
        description: This option switches off the "URL globbing parser". When you set this option, you can specify URLs that contain the letters {}[] without having curl itself interpret them. Note that these letters are not normal legal URL contents but they should be encoded according to the URI standard.
        default: false
        x-apexe-flag-aliases:
        - -g
        - --globoff
        x-apexe-flag: --globoff
      happy_eyeballs_timeout_ms:
        type: number
        description: Happy Eyeballs is an algorithm that attempts to connect to both IPv4 and IPv6 addresses for dual-stack hosts, giving IPv6 a head-start of the specified number of milliseconds. If the IPv6 address cannot be connected to within that time, then a connection attempt is made to the IPv4 address in parallel. The first connection to be established is the one that is used.
        x-apexe-flag-aliases:
        - --happy-eyeballs-timeout-ms
        x-apexe-flag: --happy-eyeballs-timeout-ms
      haproxy_clientip:
        type: string
        description: (HTTP) Sets a client IP in HAProxy PROXY protocol v1 header at the beginning of the connection.
        x-apexe-flag-aliases:
        - --haproxy-clientip
        x-apexe-flag: --haproxy-clientip
      haproxy_protocol:
        type: boolean
        description: (HTTP) Send a HAProxy PROXY protocol v1 header at the beginning of the connection. This is used by some load balancers and reverse proxies to indicate the client's true IP address and port.
        default: false
        x-apexe-flag-aliases:
        - --haproxy-protocol
        x-apexe-flag: --haproxy-protocol
      head:
        type: boolean
        description: (HTTP FTP FILE) Fetch the headers only! HTTP-servers feature the command HEAD which this uses to get nothing but the header of a document. When used on an FTP or FILE file, curl displays the file size and last modification time only.
        default: false
        x-apexe-flag-aliases:
        - -I
        - --head
        x-apexe-flag: --head
      header:
        type: string
        description: (HTTP IMAP SMTP) Extra header to include in information sent. When used within an HTTP request, it is added to the regular request headers.
        x-apexe-flag-aliases:
        - -H
        - --header
        x-apexe-flag: --header
        x-sensitive: true
      hostpubmd5:
