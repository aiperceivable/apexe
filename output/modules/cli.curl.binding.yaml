            x-apexe-flag: --preproxy
          progress_bar:
            type: boolean
            description: Make curl display transfer progress as a simple progress bar instead of the standard, more informational, meter.
            default: false
            x-apexe-flag-aliases:
            - -#
            - --progress-bar
            x-apexe-flag: --progress-bar
          proto_default:
            type: string
            description: Tells curl to use protocol for any URL missing a scheme name.
            x-apexe-flag-aliases:
            - --proto-default
            x-apexe-flag: --proto-default
          proto_redir:
            type: string
            description: Tells curl to limit what protocols it may use on redirect. Protocols denied by --proto are not overridden by this option. See --proto for how protocols are represented.
            x-apexe-flag-aliases:
            - --proto-redir
            x-apexe-flag: --proto-redir
          proto:
            type: string
            description: 'Tells curl to limit what protocols it may use for transfers. Protocols are evaluated left to right, are comma separated, and are each a protocol name or ''all'', optionally prefixed by zero or more modifiers. Available modifiers are:'
            x-apexe-flag-aliases:
            - --proto
            x-apexe-flag: --proto
          proxy_anyauth:
            type: boolean
            description: Tells curl to pick a suitable authentication method when communicating with the given HTTP proxy. This might cause an extra request/response round-trip.
            default: false
            x-apexe-flag-aliases:
            - --proxy-anyauth
            x-apexe-flag: --proxy-anyauth
          proxy_basic:
            type: boolean
            description: Tells curl to use HTTP Basic authentication when communicating with the given proxy. Use --basic for enabling HTTP Basic with a remote host. Basic is the default authentication method curl uses with proxies.
            default: false
            x-apexe-flag-aliases:
            - --proxy-basic
            x-apexe-flag: --proxy-basic
          proxy_ca_native:
            type: boolean
            description: (TLS) Tells curl to use the CA store from the native operating system to verify the HTTPS proxy. By default, curl uses a CA store provided in a single file or directory, but when using this option it interfaces the operating system's own vault.
            default: false
            x-apexe-flag-aliases:
            - --proxy-ca-native
            x-apexe-flag: --proxy-ca-native
          proxy_cacert:
            type: string
            x-apexe-path: true
            description: Same as --cacert but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-cacert
            x-apexe-flag: --proxy-cacert
          proxy_capath:
            type: string
            x-apexe-path: true
            description: Same as --capath but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-capath
            x-apexe-flag: --proxy-capath
          proxy_cert_type:
            type: string
            description: Same as --cert-type but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-cert-type
            x-apexe-flag: --proxy-cert-type
            x-sensitive: true
          proxy_cert:
            type: string
            description: Same as -E, --cert but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-cert
            x-apexe-flag: --proxy-cert
            x-sensitive: true
          proxy_ciphers:
            type: string
            description: Same as --ciphers but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-ciphers
            x-apexe-flag: --proxy-ciphers
          proxy_crlfile:
            type: string
            x-apexe-path: true
            description: Same as --crlfile but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-crlfile
            x-apexe-flag: --proxy-crlfile
          proxy_digest:
            type: boolean
            description: Tells curl to use HTTP Digest authentication when communicating with the given proxy. Use --digest for enabling HTTP Digest with a remote host.
            default: false
            x-apexe-flag-aliases:
            - --proxy-digest
            x-apexe-flag: --proxy-digest
          proxy_header:
            type: string
            description: (HTTP) Extra header to include in the request when sending HTTP to a proxy. You may specify any number of extra headers. This is the equivalent option to -H, --header but is for proxy communication only like in CONNECT requests when you want a separate header sent to the proxy to what is sent to the actual remote host.
            x-apexe-flag-aliases:
            - --proxy-header
            x-apexe-flag: --proxy-header
            x-sensitive: true
          proxy_http2:
            type: boolean
            description: (HTTP) Tells curl to try negotiate HTTP version 2 with an HTTPS proxy. The proxy might still only offer HTTP/1 and then curl sticks to using that version.
            default: false
            x-apexe-flag-aliases:
            - --proxy-http2
            x-apexe-flag: --proxy-http2
          proxy_insecure:
            type: boolean
            description: Same as -k, --insecure but used in HTTPS proxy context.
            default: false
            x-apexe-flag-aliases:
            - --proxy-insecure
            x-apexe-flag: --proxy-insecure
          proxy_key_type:
            type: string
            description: Same as --key-type but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-key-type
            x-apexe-flag: --proxy-key-type
            x-sensitive: true
          proxy_key:
            type: string
            description: Same as --key but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-key
            x-apexe-flag: --proxy-key
            x-sensitive: true
          proxy_negotiate:
            type: boolean
            description: Tells curl to use HTTP Negotiate (SPNEGO) authentication when communicating with the given proxy. Use --negotiate for enabling HTTP Negotiate (SPNEGO) with a remote host.
            default: false
            x-apexe-flag-aliases:
            - --proxy-negotiate
            x-apexe-flag: --proxy-negotiate
          proxy_ntlm:
            type: boolean
            description: Tells curl to use HTTP NTLM authentication when communicating with the given proxy. Use --ntlm for enabling NTLM with a remote host.
            default: false
            x-apexe-flag-aliases:
            - --proxy-ntlm
            x-apexe-flag: --proxy-ntlm
          proxy_pass:
            type: string
            description: Same as --pass but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-pass
            x-apexe-flag: --proxy-pass
            x-sensitive: true
          proxy_pinnedpubkey:
            type: string
            description: (TLS) Tells curl to use the specified public key file (or hashes) to verify the proxy. This can be a path to a file which contains a single public key in PEM or DER format, or any number of base64 encoded sha256 hashes preceded by 'sha256//' and separated by ';'.
            x-apexe-flag-aliases:
            - --proxy-pinnedpubkey
            x-apexe-flag: --proxy-pinnedpubkey
          proxy_service_name:
            type: string
            description: This option allows you to change the service name for proxy negotiation.
            x-apexe-flag-aliases:
            - --proxy-service-name
            x-apexe-flag: --proxy-service-name
          proxy_ssl_allow_beast:
            type: boolean
            description: Same as --ssl-allow-beast but used in HTTPS proxy context.
            default: false
            x-apexe-flag-aliases:
            - --proxy-ssl-allow-beast
            x-apexe-flag: --proxy-ssl-allow-beast
          proxy_ssl_auto_client_cert:
            type: boolean
            description: Same as --ssl-auto-client-cert but used in HTTPS proxy context.
            default: false
            x-apexe-flag-aliases:
            - --proxy-ssl-auto-client-cert
            x-apexe-flag: --proxy-ssl-auto-client-cert
          proxy_tls13_ciphers:
            type: string
            description: '(TLS) Specifies which cipher suites to use in the connection to your HTTPS proxy when it negotiates TLS 1.3. The list of ciphers suites must specify valid ciphers. Read up on TLS 1.3 cipher suite details on this URL:'
            x-apexe-flag-aliases:
            - --proxy-tls13-ciphers
            x-apexe-flag: --proxy-tls13-ciphers
          proxy_tlsauthtype:
            type: string
            description: Same as --tlsauthtype but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-tlsauthtype
            x-apexe-flag: --proxy-tlsauthtype
          proxy_tlspassword:
            type: string
            description: Same as --tlspassword but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-tlspassword
            x-apexe-flag: --proxy-tlspassword
            x-sensitive: true
          proxy_tlsuser:
            type: string
            description: Same as --tlsuser but used in HTTPS proxy context.
            x-apexe-flag-aliases:
            - --proxy-tlsuser
            x-apexe-flag: --proxy-tlsuser
            x-sensitive: true
          proxy_tlsv1:
            type: boolean
            description: Same as -1, --tlsv1 but used in HTTPS proxy context.
            default: false
            x-apexe-flag-aliases:
            - --proxy-tlsv1
            x-apexe-flag: --proxy-tlsv1
          proxy_user:
            type: string
            description: Specify the user name and password to use for proxy authentication.
            x-apexe-flag-aliases:
            - -U
            - --proxy-user
            x-apexe-flag: --proxy-user
            x-sensitive: true
          proxy:
            type: string
            description: Use the specified proxy.
            x-apexe-flag-aliases:
            - -x
            - --proxy
            x-apexe-flag: --proxy
          proxy1.0:
            type: string
            description: Use the specified HTTP 1.0 proxy. If the port number is not specified, it is assumed at port 1080.
            x-apexe-flag-aliases:
            - --proxy1.0
            x-apexe-flag: --proxy1.0
          proxytunnel:
            type: boolean
            description: When an HTTP proxy is used -x, --proxy, this option makes curl tunnel the traffic through the proxy. The tunnel approach is made with the HTTP proxy CONNECT request and requires that the proxy allows direct connect to the remote port number curl wants to tunnel through to.
            default: false
            x-apexe-flag-aliases:
            - -p
            - --proxytunnel
            x-apexe-flag: --proxytunnel
          pubkey:
            type: string
            description: (SFTP SCP) Public key file name. Allows you to provide your public key in this separate file.
            x-apexe-flag-aliases:
            - --pubkey
            x-apexe-flag: --pubkey
          quote:
            type: string
            description: (FTP SFTP) Send an arbitrary command to the remote FTP or SFTP server. Quote commands are sent BEFORE the transfer takes place (just after the initial PWD command in an FTP transfer, to be exact). To make commands take place after a successful transfer, prefix them with a dash '-'.
            x-apexe-flag-aliases:
            - -Q
            - --quote
            x-apexe-flag: --quote
          random_file:
            type: string
            x-apexe-path: true
            description: Deprecated option. This option is ignored (added in 7.84.0). Prior to that it only had an effect on curl if built to use old versions of OpenSSL.
            x-apexe-flag-aliases:
            - --random-file
            x-apexe-flag: --random-file
          range:
            type: string
            description: (HTTP FTP SFTP FILE) Retrieve a byte range (i.e. a partial document) from an HTTP/1.1, FTP or SFTP server or a local FILE. Ranges can be specified in a number of ways.
            x-apexe-flag-aliases:
            - -r
            - --range
            x-apexe-flag: --range
          raw:
            type: boolean
            description: (HTTP) When used, it disables all internal HTTP decoding of content or transfer encodings and instead makes them passed on unaltered, raw.
            default: false
            x-apexe-flag-aliases:
            - --raw
            x-apexe-flag: --raw
          referer:
            type: string
            format: uri
            description: '(HTTP) Sends the "Referrer Page" information to the HTTP server. This can also be set with the -H, --header flag of course. When used with -L, --location you can append ";auto" to the -e, --referer URL to make curl automatically set the previous URL when it follows a Location: header. The ";auto" string can be used alone, even if you do not set an initial -e, --referer.'
            x-apexe-flag-aliases:
            - -e
            - --referer
            x-apexe-flag: --referer
          remote_header_name:
            type: boolean
            description: (HTTP) This option tells the -O, --remote-name option to use the server-specified Content-Disposition filename instead of extracting a filename from the URL. If the server-provided file name contains a path, that is stripped off before the file name is used.
            default: false
            x-apexe-flag-aliases:
            - -J
            - --remote-header-name
            x-apexe-flag: --remote-header-name
          remote_name_all:
            type: boolean
            description: This option changes the default action for all given URLs to be dealt with as if -O, --remote-name were used for each one. So if you want to disable that for a specific URL after --remote-name-all has been used, you must use "-o -" or --no-remote-name.
            default: false
            x-apexe-flag-aliases:
            - --remote-name-all
            x-apexe-flag: --remote-name-all
          remote_time:
            type: boolean
            description: Makes curl attempt to figure out the timestamp of the remote file that is getting downloaded, and if that is available make the local file get that same timestamp.
            default: false
            x-apexe-flag-aliases:
            - -R
            - --remote-time
            x-apexe-flag: --remote-time
          remove_on_error:
            type: boolean
            description: When curl returns an error when told to save output in a local file, this option removes that saved file before exiting. This prevents curl from leaving a partial file in the case of an error during transfer.
            default: false
            x-apexe-flag-aliases:
            - --remove-on-error
            x-apexe-flag: --remove-on-error
          request_target:
            type: string
            x-apexe-path: true
            description: (HTTP) Tells curl to use an alternative "target" (path) instead of using the path as provided in the URL. Particularly useful when wanting to issue HTTP requests without leading slash or other data that does not follow the regular URL pattern, like "OPTIONS *".
            x-apexe-flag-aliases:
            - --request-target
            x-apexe-flag: --request-target
          request:
            type: string
            description: Change the method to use when starting the transfer.
            x-apexe-flag-aliases:
            - -X
            - --request
            x-apexe-flag: --request
          resolve:
            type: string
            description: Provide a custom address for a specific host and port pair. Using this, you can make the curl requests(s) use a specified address and prevent the otherwise normally resolved address to be used. Consider it a sort of /etc/hosts alternative provided on the command line. The port number should be the number used for the specific protocol the host is used for. It means you need several entries if you want to provide address for the same host but different ports.
            x-apexe-flag-aliases:
            - --resolve
            x-apexe-flag: --resolve
          retry_all_errors:
            type: boolean
            description: Retry on any error. This option is used together with --retry.
            default: false
            x-apexe-flag-aliases:
            - --retry-all-errors
            x-apexe-flag: --retry-all-errors
          retry_connrefused:
            type: boolean
            description: In addition to the other conditions, consider ECONNREFUSED as a transient error too for --retry. This option is used together with --retry.
            default: false
            x-apexe-flag-aliases:
            - --retry-connrefused
            x-apexe-flag: --retry-connrefused
          retry_delay:
            type: number
            description: Make curl sleep this amount of time before each retry when a transfer has failed with a transient error (it changes the default backoff time algorithm between retries). This option is only interesting if --retry is also used. Setting this delay to zero makes curl use the default backoff time.
            x-apexe-flag-aliases:
            - --retry-delay
            x-apexe-flag: --retry-delay
          retry_max_time:
            type: number
            description: The retry timer is reset before the first transfer attempt. Retries are done as usual (see --retry) as long as the timer has not reached this given limit. Notice that if the timer has not reached the limit, the request is made and while performing, it may take longer than this given time period. To limit a single request's maximum time, use -m, --max-time. Set this option to zero to not timeout retries.
            x-apexe-flag-aliases:
            - --retry-max-time
            x-apexe-flag: --retry-max-time
          retry:
            type: integer
            description: 'If a transient error is returned when curl tries to perform a transfer, it retries this number of times before giving up. Setting the number to 0 makes curl do no retries (which is the default). Transient error means either: a timeout, an FTP 4xx response code or an HTTP 408, 429, 500, 502, 503 or 504 response code.'
            x-apexe-flag-aliases:
            - --retry
            x-apexe-flag: --retry
          sasl_authzid:
            type: string
            description: Use this authorization identity (authzid), during SASL PLAIN authentication, in addition to the authentication identity (authcid) as specified by -u, --user.
            x-apexe-flag-aliases:
            - --sasl-authzid
            x-apexe-flag: --sasl-authzid
          sasl_ir:
            type: boolean
            description: Enable initial response in SASL authentication.
            default: false
            x-apexe-flag-aliases:
            - --sasl-ir
            x-apexe-flag: --sasl-ir
          service_name:
            type: string
            description: This option allows you to change the service name for SPNEGO.
            x-apexe-flag-aliases:
            - --service-name
            x-apexe-flag: --service-name
          show_error:
            type: boolean
            description: When used with -s, --silent, it makes curl show an error message if it fails.
            default: false
            x-apexe-flag-aliases:
            - -S
            - --show-error
            x-apexe-flag: --show-error
          socks4:
            type: string
            description: Use the specified SOCKS4 proxy. If the port number is not specified, it is assumed at port 1080. Using this socket type make curl resolve the host name and passing the address on to the proxy.
            x-apexe-flag-aliases:
            - --socks4
            x-apexe-flag: --socks4
          socks4a:
            type: string
            description: Use the specified SOCKS4a proxy. If the port number is not specified, it is assumed at port 1080. This asks the proxy to resolve the host name.
            x-apexe-flag-aliases:
            - --socks4a
            x-apexe-flag: --socks4a
          socks5_basic:
            type: boolean
            description: Tells curl to use username/password authentication when connecting to a SOCKS5 proxy. The username/password authentication is enabled by default. Use --socks5-gssapi to force GSS-API authentication to SOCKS5 proxies.
            default: false
            x-apexe-flag-aliases:
            - --socks5-basic
            x-apexe-flag: --socks5-basic
          socks5_gssapi_nec:
            type: boolean
            description: As part of the GSS-API negotiation a protection mode is negotiated. RFC 1961 says in section 4.3/4.4 it should be protected, but the NEC reference implementation does not. The option --socks5-gssapi-nec allows the unprotected exchange of the protection mode negotiation.
            default: false
            x-apexe-flag-aliases:
            - --socks5-gssapi-nec
            x-apexe-flag: --socks5-gssapi-nec
          socks5_gssapi_service:
            type: string
            description: The default service name for a socks server is rcmd/server-fqdn. This option allows you to change it.
            x-apexe-flag-aliases:
            - --socks5-gssapi-service
            x-apexe-flag: --socks5-gssapi-service
          socks5_gssapi:
            type: boolean
            description: Tells curl to use GSS-API authentication when connecting to a SOCKS5 proxy.  The GSS-API authentication is enabled by default (if curl is compiled with GSS-API support). Use --socks5-basic to force username/password authentication to SOCKS5 proxies.
            default: false
            x-apexe-flag-aliases:
            - --socks5-gssapi
            x-apexe-flag: --socks5-gssapi
          socks5_hostname:
            type: string
            description: Use the specified SOCKS5 proxy (and let the proxy resolve the host name). If the port number is not specified, it is assumed at port 1080.
            x-apexe-flag-aliases:
            - --socks5-hostname
            x-apexe-flag: --socks5-hostname
          socks5:
            type: string
            description: Use the specified SOCKS5 proxy - but resolve the host name locally. If the port number is not specified, it is assumed at port 1080.
            x-apexe-flag-aliases:
            - --socks5
            x-apexe-flag: --socks5
          speed_limit:
            type: string
            description: If a transfer is slower than this set speed (in bytes per second) for a given number of seconds, it gets aborted. The time period is set with -y, --speed-time and is 30 seconds by default.
            x-apexe-flag-aliases:
            - -Y
            - --speed-limit
            x-apexe-flag: --speed-limit
          speed_time:
            type: number
            description: If a transfer runs slower than speed-limit bytes per second during a speed-time period, the transfer is aborted. If speed-time is used, the default speed-limit is 1 unless set with -Y, --speed-limit.
            x-apexe-flag-aliases:
            - -y
            - --speed-time
            x-apexe-flag: --speed-time
          ssl_allow_beast:
            type: boolean
            description: (TLS) This option tells curl to not work around a security flaw in the SSL3 and TLS1.0 protocols known as BEAST. If this option is not used, the SSL layer may use workarounds known to cause interoperability problems with some older SSL implementations.
            default: false
            x-apexe-flag-aliases:
            - --ssl-allow-beast
            x-apexe-flag: --ssl-allow-beast
          ssl_auto_client_cert:
            type: boolean
            description: (TLS) (Schannel) Tell libcurl to automatically locate and use a client certificate for authentication, when requested by the server. Since the server can request any certificate that supports client authentication in the OS certificate store it could be a privacy violation and unexpected.
            default: false
            x-apexe-flag-aliases:
            - --ssl-auto-client-cert
            x-apexe-flag: --ssl-auto-client-cert
          ssl_no_revoke:
            type: boolean
            description: '(TLS) (Schannel) This option tells curl to disable certificate revocation checks.  WARNING: this option loosens the SSL security, and by using this flag you ask for exactly that.'
            default: false
            x-apexe-flag-aliases:
            - --ssl-no-revoke
            x-apexe-flag: --ssl-no-revoke
          ssl_reqd:
            type: boolean
            description: (FTP IMAP POP3 SMTP LDAP) Require SSL/TLS for the connection. Terminates the connection if the transfer cannot be upgraded to use SSL/TLS.
            default: false
            x-apexe-flag-aliases:
            - --ssl-reqd
            x-apexe-flag: --ssl-reqd
          ssl_revoke_best_effort:
            type: boolean
            description: (TLS) (Schannel) This option tells curl to ignore certificate revocation checks when they failed due to missing/offline distribution points for the revocation check lists.
            default: false
            x-apexe-flag-aliases:
            - --ssl-revoke-best-effort
            x-apexe-flag: --ssl-revoke-best-effort
          ssl:
            type: boolean
            description: '(FTP IMAP POP3 SMTP LDAP) Warning: this is considered an insecure option. Consider using --ssl-reqd instead to be sure curl upgrades to a secure connection.'
            default: false
            x-apexe-flag-aliases:
            - --ssl
            x-apexe-flag: --ssl
          sslv2:
            type: boolean
            description: (SSL) This option previously asked curl to use SSLv2, but is now ignored (added in 7.77.0). SSLv2 is widely considered insecure (see RFC 6176).
            default: false
            x-apexe-flag-aliases:
            - '-2'
            - --sslv2
            x-apexe-flag: --sslv2
          sslv3:
            type: boolean
            description: (SSL) This option previously asked curl to use SSLv3, but is now ignored (added in 7.77.0). SSLv3 is widely considered insecure (see RFC 7568).
            default: false
            x-apexe-flag-aliases:
            - '-3'
            - --sslv3
            x-apexe-flag: --sslv3
          stderr:
            type: string
            x-apexe-path: true
            description: Redirect all writes to stderr to the specified file instead. If the file name is a plain '-', it is instead written to stdout.
            x-apexe-flag-aliases:
            - --stderr
            x-apexe-flag: --stderr
          styled_output:
            type: boolean
            description: Enables the automatic use of bold font styles when writing HTTP headers to the terminal. Use --no-styled-output to switch them off.
            default: false
            x-apexe-flag-aliases:
            - --styled-output
            x-apexe-flag: --styled-output
          suppress_connect_headers:
            type: boolean
            description: When -p, --proxytunnel is used and a CONNECT request is made do not output proxy CONNECT response headers. This option is meant to be used with -D, --dump-header or -i, --include which are used to show protocol headers in the output. It has no effect on debug options such as -v, --verbose or --trace, or any statistics.
            default: false
            x-apexe-flag-aliases:
            - --suppress-connect-headers
            x-apexe-flag: --suppress-connect-headers
          tcp_fastopen:
            type: boolean
            description: Enable use of TCP Fast Open (RFC 7413). TCP Fast Open is a TCP extension that allows data to get sent earlier over the connection (before the final handshake ACK) if the client and server have been connected previously.
            default: false
            x-apexe-flag-aliases:
            - --tcp-fastopen
            x-apexe-flag: --tcp-fastopen
          tcp_nodelay:
            type: boolean
            description: Turn on the TCP_NODELAY option. See the curl_easy_setopt(3) man page for details about this option.
            default: false
            x-apexe-flag-aliases:
            - --tcp-nodelay
            x-apexe-flag: --tcp-nodelay
          telnet_option:
            type: string
            description: 'Pass options to the telnet protocol. Supported options are:'
            x-apexe-flag-aliases:
            - -t
            - --telnet-option
            x-apexe-flag: --telnet-option
          tftp_blksize:
            type: string
            description: (TFTP) Set the TFTP BLKSIZE option (must be >512). This is the block size that curl tries to use when transferring data to or from a TFTP server. By default 512 bytes are used.
            x-apexe-flag-aliases:
            - --tftp-blksize
            x-apexe-flag: --tftp-blksize
          tftp_no_options:
            type: boolean
            description: (TFTP) Tells curl not to send TFTP options requests.
            default: false
            x-apexe-flag-aliases:
            - --tftp-no-options
            x-apexe-flag: --tftp-no-options
