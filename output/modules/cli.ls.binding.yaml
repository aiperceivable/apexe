        x-apexe-flag: -p
      q:
        type: boolean
        description: Force printing of non-graphic characters in file names as the character ‘?’; this is the default when output is to a terminal.
        default: false
        x-apexe-flag-aliases:
        - -q
        x-apexe-flag: -q
      r:
        type: boolean
        description: Reverse the order of the sort.
        default: false
        x-apexe-flag-aliases:
        - -r
        x-apexe-flag: -r
      s:
        type: boolean
        description: Display the number of blocks used in the file system by each file.  Block sizes and directory totals are handled as described in The Long Format subsection below, except (if the long format is not also requested) the directory totals are not output when the output is in a single column, even if multi-column output is requested.  (-l) format, display complete time information for the file, including month, day, hour, minute, second, and year. The -D option gives even more control over the output format. This option is not defined in IEEE Std 1003.1-2008 (“POSIX.1”).
        default: false
        x-apexe-flag-aliases:
        - -s
        x-apexe-flag: -s
      t:
        type: boolean
        description: Sort by descending time modified (most recently modified first). If two files have the same modification timestamp, sort their names in ascending lexicographical order.  The -r option reverses both of these sort orders.
        default: false
        x-apexe-flag-aliases:
        - -t
        x-apexe-flag: -t
      u:
        type: boolean
        description: Use time of last access, instead of time of last modification of the file for sorting (-t) or long printing (-l).
        default: false
        x-apexe-flag-aliases:
        - -u
        x-apexe-flag: -u
      v:
        type: boolean
        description: Force unedited printing of non-graphic characters; this is the default when output is not to a terminal.
        default: false
        x-apexe-flag-aliases:
        - -v
        x-apexe-flag: -v
      w:
        type: boolean
        description: Force raw printing of non-printable characters. This is the default when output is not to a terminal.  This option is not defined in IEEE Std 1003.1-2001 (“POSIX.1”).
        default: false
        x-apexe-flag-aliases:
        - -w
        x-apexe-flag: -w
      x:
        type: boolean
        description: The same as -C, except that the multi-column output is produced with entries sorted across, rather than down, the columns.
        default: false
        x-apexe-flag-aliases:
        - -x
        x-apexe-flag: -x
      y:
        type: boolean
        description: When the -t option is set, sort the alphabetical output in the same order as the time output.  This has the same effect as setting LS_SAMESORT.  See the description of the -t option for more details.  This option is not defined in IEEE Std 1003.1-2001 (“POSIX.1”).
        default: false
        x-apexe-flag-aliases:
        - -y
        x-apexe-flag: -y
      '1':
        type: boolean
        description: (The numeric digit “one”.) Force output to be one entry per line. This is the default when output is not to a terminal.
        default: false
        x-apexe-flag-aliases:
        - '-1'
        x-apexe-flag: '-1'
      '%':
        type: boolean
        description: Distinguish dataless files and directories with a '%' character in long (-l) output, and don't materialize dataless directories when listing them.
        default: false
        x-apexe-flag-aliases:
        - -%
        x-apexe-flag: -%
      file:
        type: array
        items:
          type: string
        x-apexe-positional: 0
    additionalProperties: false
  output_schema:
    type: object
    properties:
      stdout:
        type: string
        description: Standard output from the command
      stderr:
        type: string
        description: Standard error output from the command
      exit_code:
        type: integer
        description: Process exit code (0 = success)
    required:
    - stdout
    - stderr
    - exit_code
