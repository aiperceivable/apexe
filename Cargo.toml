[package]
name = "apexe"
version = "0.7.0"
edition = "2021"
description = "Outside-In CLI-to-Agent Bridge"
license = "Apache-2.0"
readme = "README.md"
authors = ["aiperceivable <team@aiperceivable.com>"]
homepage = "https://aiperceivable.com"
repository = "https://github.com/aiperceivable/apexe"
documentation = "https://aiperceivable.github.io/apexe/"
keywords = ["mcp", "cli", "agent", "governance", "scanner"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
apcore = "0.28"
apcore-a2a = "0.6"
apcore-cli = "0.11"
apcore-mcp = "0.19"
apcore-toolkit = { version = "0.10", default-features = false }
# RFC 3339 timestamps for the governance audit records apexe writes itself
# (see `governance::audit`). Already in the graph via apcore; declared here so
# the format the audit trail promises has an owner in this manifest.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# v4 only, for minting bearer tokens from the OS CSPRNG (see `crate::auth`).
uuid = { version = "1", features = ["v4"] }
which = "7"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.76", features = ["vendored"] }

[dev-dependencies]
assert_cmd = "2"
# Drive the apcore-a2a axum Router in-process (`tests/a2a_integration.rs`), so
# what a refused caller is actually told is asserted over the real request path
# rather than through the error mapper alone. Already in the graph via
# apcore-a2a; declared here because the tests call them directly.
axum = "0.8"
http-body-util = "0.1"
predicates = "3"
rstest = "0.23"
tempfile = "3"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "apexe"
path = "src/main.rs"

[[example]]
name = "acl_demo"
path = "examples/acl_demo/main.rs"

[[example]]
name = "path_guard"
path = "examples/path_guard/main.rs"
